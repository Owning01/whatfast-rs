[package]
name = "whatfast-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Protobuf contract of the Whatfast bridge, generated from proto/bridge.proto."

[dependencies]
prost.workspace = true
thiserror.workspace = true
# The transport's queues are `async_channel`, the same FIFO abstraction the
# origin used: it works with any executor, so the crate imposes no runtime.
async-channel.workspace = true

[dev-dependencies]
# The ported cases of the origin drive a fake sidecar through the same
# channels the transport uses.
async-channel.workspace = true

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"
