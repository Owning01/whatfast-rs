[package]
name = "whatfast-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GPUI user interface of Whatfast."

[features]
# The engine of documents (markdown blocks and diagrams) is not connected to
# the conversation yet, but it is part of the default build: its tests run
# with the rest. The flag turns it off for a build that does not want it.
default = ["documents"]
documents = []

# The build script of the crate: it puts the icon of Whatfast inside the
# executable of Windows (the Explorer, the task bar and the alt-tab show it).
[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
anyhow.workspace = true
mimalloc.workspace = true
async-channel.workspace = true
whatfast-core = { path = "../whatfast-core" }
whatfast-i18n = { path = "../whatfast-i18n" }
# The catalog of the agent harnesses and the registration of the server in the
# configuration of each one: the screen of the agents runs it with one click.
whatfast-agents = { path = "../whatfast-agents" }
# The permissions and the drafts of the agents, in the shared `agents.db`.
whatfast-auto = { path = "../whatfast-auto" }
# The MCP server an agent harness starts from this same executable
# (`whatfast mcp --agent <id>`): the tools, the local bridge client.
whatfast-mcp = { path = "../whatfast-mcp" }
whatfast-model = { path = "../whatfast-model" }
whatfast-protocol = { path = "../whatfast-protocol" }
# The GPUI stack comes from the Zed repository. Do NOT add `rev = ...` here:
# the crates inside that repository depend on each other by plain git URL, so
# a `rev` on the direct dependencies would resolve to a SECOND copy of gpui
# and the `AssetSource` trait would not match. The commit is pinned in
# `Cargo.lock` (zed#1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba), and that is
# what `gpui-component` at its pinned revision compiles against.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
emojis = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# El export del editor dibuja los textos y las formas sobre la foto final: la
# fuente del sistema se rasteriza con fontdue y los emojis salen de los PNG
# CBDT de la misma fuente que pinta la ventana.
fontdue = "0.9"
ttf-parser = "0.25"
# La nota de voz se reproduce dentro del chat: el decodificador de Opus es
# puro Rust (sin libopus ni cmake) y rodio pone la salida del sistema.
ogg = "0.9.2"
opus-decoder = "0.1.1"
# La nota de voz se graba: `cpal` lee el microfono del sistema y `opus-pure`
# arma el Ogg Opus que pide el backend, sin librerias nativas ni cmake.
cpal = "0.18"
opus-pure = "0.2.2"
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "mp4",
    "vorbis",
    "wav",
] }
qrcode = { version = "0.14", default-features = false }
# El PIN del bloqueo de la aplicacion no se guarda: se guarda su PBKDF2 con
# una sal aleatoria, y la comprobacion es la que desbloquea la ventana.
pbkdf2 = "0.12"
sha2 = "0.10"
smol = "2"
uuid = { version = "1.18", features = ["v4"] }
# The custom themes of the profile are JSON inside the settings file.
serde_json = "1.0"
# The drafts of the composer are JSON too: text, reply and mentions per chat.
serde = { version = "1", features = ["derive"] }
# The self-update reads the manifest of the release and downloads the two
# executables over TLS: the same client the sidecar uses.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# The toasts of the system when a message arrives in the background: the
# same call paints on the notification center of each platform.
notify-rust = "4.18"

# The dialog of the system for the messages that happen before there is a
# window, and the check of the process that holds the lock of the instance:
# the app is a `windows_subsystem`, so it has no console.
[target.'cfg(windows)'.dependencies]
# The handle of the window of GPUI, so the tray knows which window to hide
# and which one to show. The version is the one that gpui already links.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# El video de los mensajes se decodifica con Media Foundation, que viene con
# Windows: no hay decodificador externo ni librerias que instalar.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

# The lock of the single instance asks the system whether the process that
# wrote it is still there. `/proc` only exists on Linux, and macOS has no such
# directory, so the question goes through `kill(pid, 0)`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"
