[package]
name = "whatfast-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The translations of the interface of Whatfast: one JSON file per language."

[dependencies]
# The build script turns each file into a perfect hash map: the runtime only
# reads the table, it never parses JSON.
phf = { version = "0.11", default-features = false }

[build-dependencies]
phf_codegen = "0.11"
serde_json = "1.0"
