name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "La etiqueta del release (v0.1.0)"
        required: true
      omitir_macos:
        description: "No compilar macOS en esta corrida"
        type: boolean
        default: false

permissions:
  contents: write

# Los tres paquetes salen con el mismo texto: cada job crea o actualiza el
# mismo release, y el body se reescribe igual, asi que no importa cual gane.
jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
      - name: el sidecar en Go
        run: |
          cd backend
          go build -trimpath -ldflags "-s -w" -o bin\whatfast-backend.exe .\cmd\whatfast-backend
          cd ..
      - name: la interfaz en release
        run: cargo build --release -p whatfast-ui
      - name: armar el paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\icons | Out-Null
          Copy-Item target\release\whatfast-ui.exe dist\whatfast.exe
          Copy-Item backend\bin\whatfast-backend.exe dist\whatfast-backend.exe
          Copy-Item assets\icons\32x32.png,assets\icons\128x128.png,assets\icons\128x128@2x.png,assets\icons\icon.ico,assets\icons\icon.icns dist\icons\
          Compress-Archive -Path dist\* -DestinationPath whatfast-windows.zip
          Get-ChildItem dist\whatfast.exe,dist\whatfast-backend.exe | ForEach-Object { "{0} {1:N0} bytes" -f $_.Name, $_.Length }
      - name: el instalador
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          if(-not (Test-Path whatfast-setup.exe)) { throw "el instalador no salio" }
          Get-Item whatfast-setup.exe | ForEach-Object { "whatfast-setup.exe {0:N0} bytes" -f $_.Length }
      - name: las sumas de verificacion
        shell: pwsh
        run: |
          # Sin firma de codigo, la suma es lo unico que deja comprobar que el
          # archivo que se bajo es el que se publico.
          foreach ($archivo in @("whatfast-windows.zip", "whatfast-setup.exe")) {
            $hash = (Get-FileHash $archivo -Algorithm SHA256).Hash.ToLower()
            "$hash  $archivo" | Set-Content -Encoding ascii "$archivo.sha256"
            Get-Content "$archivo.sha256"
          }
      - name: publicar
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            whatfast-windows.zip
            whatfast-windows.zip.sha256
            whatfast-setup.exe
            whatfast-setup.exe.sha256
          body: |
            Whatfast, cliente de escritorio de WhatsApp.

            ## Windows

            `whatfast-windows.zip` trae los dos ejecutables: `whatfast.exe` (la
            interfaz nativa) y `whatfast-backend.exe` (el sidecar que habla con
            WhatsApp). Los dos tienen que estar en la misma carpeta.

            `whatfast-setup.exe` es el instalador: deja todo en Archivos de
            programa y arma los accesos directos.

            ## Linux

            `whatfast-linux.tar.gz`. Se descomprime en cualquier carpeta y se
            corre `./whatfast`; `whatfast` y `whatfast-backend` van juntos.
            Para instalarlo en el sistema, desde la carpeta descomprimida:

            ```
            sudo install -Dm755 whatfast whatfast-backend -t /usr/local/bin
            sudo install -Dm644 share/applications/whatfast.desktop -t /usr/share/applications
            sudo cp -r share/icons/hicolor/* /usr/share/icons/hicolor/
            ```

            El binario pide estas bibliotecas del sistema (Wayland y fontconfig
            van por dlopen: si estan, las usa). En Debian y Ubuntu:

            ```
            sudo apt install libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
              libxcb-xkb1 libxau6 libxdmcp6 libfontconfig1 libgl1 libvulkan1 \
              libasound2
            ```

            ## macOS

            Esta version no trae paquete de macOS.
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
      - name: las dependencias del sistema que pide el stack de GPUI
        run: |
          sudo apt-get update
          # gpui_wgpu usa font-kit: pkg-config tiene que encontrar fontconfig y
          # freetype, o yeslogic-fontconfig-sys no compila. rodio suena por
          # ALSA en Linux: cpal busca la cabecera con pkg-config o el crate
          # alsa-sys no compila.
          sudo apt-get install --yes \
            build-essential cmake clang lld pkg-config \
            libfontconfig-dev libfreetype-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev libxau-dev libxdmcp-dev \
            libwayland-dev libx11-xcb-dev \
            libasound2-dev \
            libssl-dev libvulkan1 libglib2.0-dev libzstd-dev
      - name: el sidecar en Go
        run: |
          cd backend
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/whatfast-backend ./cmd/whatfast-backend
          cd ..
      - name: la interfaz en release
        run: cargo build --release -p whatfast-ui
      - name: armar el paquete
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m755 target/release/whatfast-ui dist/whatfast
          install -m755 backend/bin/whatfast-backend dist/whatfast-backend

          # La entrada de escritorio y los iconos, en el arbol que espera
          # freedesktop: share/applications y share/icons/hicolor/<tamano>/apps.
          install -Dm644 assets/linux/whatfast.desktop dist/share/applications/whatfast.desktop
          install -Dm644 assets/icons/32x32.png           dist/share/icons/hicolor/32x32/apps/whatfast.png
          install -Dm644 assets/icons/64x64.png           dist/share/icons/hicolor/64x64/apps/whatfast.png
          install -Dm644 assets/icons/128x128.png         dist/share/icons/hicolor/128x128/apps/whatfast.png
          install -Dm644 assets/icons/128x128@2x.png      dist/share/icons/hicolor/256x256/apps/whatfast.png
          install -Dm644 assets/icons/icon.png            dist/share/icons/hicolor/512x512/apps/whatfast.png

          # La carpeta icons/ plana se mantiene: es la que traia el paquete y
          # la que buscan las versiones anteriores desde su propia carpeta.
          install -Dm644 assets/icons/32x32.png      dist/icons/32x32.png
          install -Dm644 assets/icons/128x128.png    dist/icons/128x128.png
          install -Dm644 assets/icons/128x128@2x.png dist/icons/128x128@2x.png
          install -Dm644 assets/icons/icon.png       dist/icons/icon.png

          tar -czf whatfast-linux.tar.gz -C dist .
          sha256sum whatfast-linux.tar.gz > whatfast-linux.tar.gz.sha256
          tar -tzf whatfast-linux.tar.gz
          du -h whatfast-linux.tar.gz
      - name: publicar
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            whatfast-linux.tar.gz
            whatfast-linux.tar.gz.sha256
          body: |
            Whatfast, cliente de escritorio de WhatsApp.

            ## Windows

            `whatfast-windows.zip` trae los dos ejecutables: `whatfast.exe` (la
            interfaz nativa) y `whatfast-backend.exe` (el sidecar que habla con
            WhatsApp). Los dos tienen que estar en la misma carpeta.

            `whatfast-setup.exe` es el instalador: deja todo en Archivos de
            programa y arma los accesos directos.

            ## Linux

            `whatfast-linux.tar.gz`. Se descomprime en cualquier carpeta y se
            corre `./whatfast`; `whatfast` y `whatfast-backend` van juntos.
            Para instalarlo en el sistema, desde la carpeta descomprimida:

            ```
            sudo install -Dm755 whatfast whatfast-backend -t /usr/local/bin
            sudo install -Dm644 share/applications/whatfast.desktop -t /usr/share/applications
            sudo cp -r share/icons/hicolor/* /usr/share/icons/hicolor/
            ```

            El binario pide estas bibliotecas del sistema (Wayland y fontconfig
            van por dlopen: si estan, las usa). En Debian y Ubuntu:

            ```
            sudo apt install libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
              libxcb-xkb1 libxau6 libxdmcp6 libfontconfig1 libgl1 libvulkan1 \
              libasound2
            ```

            ## macOS

            Esta version no trae paquete de macOS.
  macos:
    name: macos (${{ matrix.arch }})
    runs-on: macos-latest
    # Se puede saltear al lanzar el release a mano: la firma ad hoc y el
    # paquete de Intel no siempre son lo que se quiere publicar.
    if: ${{ github.event.inputs.omitir_macos != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub ya no tiene runners Intel (macos-13 se retiro en diciembre
          # de 2025 y los "large" son pagos): el paquete de x86_64 sale de una
          # compilacion cruzada en el runner de arm64. Es la unica via, y por
          # eso no frena el release: si falla, el de arm64 sale igual.
          - target: aarch64-apple-darwin
            arch: arm64
            goarch: arm64
            tolerante: false
          - target: x86_64-apple-darwin
            arch: x64
            goarch: amd64
            tolerante: true
    continue-on-error: ${{ matrix.tolerante }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
          key: ${{ matrix.target }}
      - name: el sidecar en Go
        run: |
          set -euo pipefail
          cd backend
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o bin/whatfast-backend ./cmd/whatfast-backend
      - name: la interfaz en release
        run: cargo build --release -p whatfast-ui --target ${{ matrix.target }}
      - name: armar el Whatfast.app
        run: |
          set -euo pipefail
          # La version vive en Cargo.toml ([workspace.package]): el plist y el
          # bundle no la repiten a mano.
          version="$(awk '/^\[workspace.package\]/{encontrado=1;next} /^\[/{encontrado=0} encontrado && /^version *=/{gsub(/[",]/,"");print $3}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "FALLO: no pude leer la version de Cargo.toml" >&2
            exit 1
          fi

          rm -rf dist
          app="dist/Whatfast.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          install -m755 "target/${{ matrix.target }}/release/whatfast-ui" "$app/Contents/MacOS/whatfast"
          install -m755 backend/bin/whatfast-backend "$app/Contents/MacOS/whatfast-backend"
          install -m644 assets/icons/icon.icns "$app/Contents/Resources/icon.icns"

          sed "s/__VERSION__/$version/g" assets/macos/Info.plist > "$app/Contents/Info.plist"
          chmod 644 "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          find "$app" -print
      - name: la firma ad hoc
        run: |
          set -euo pipefail
          # Sin firma, macOS no deja arrancar un binario de arm64. La firma ad
          # hoc no es una firma de desarrollador: alcanza para ejecutar, no
          # para pasar Gatekeeper, y por eso el release lo aclara.
          codesign --force --deep --sign - "dist/Whatfast.app"
          codesign --verify --verbose=2 "dist/Whatfast.app"
      - name: comprimir
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Whatfast.app" "whatfast-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "whatfast-macos-${{ matrix.arch }}.zip" > "whatfast-macos-${{ matrix.arch }}.zip.sha256"
          ls -l "whatfast-macos-${{ matrix.arch }}.zip"
      - name: publicar
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            whatfast-macos-${{ matrix.arch }}.zip
            whatfast-macos-${{ matrix.arch }}.zip.sha256
          body: |
            Whatfast, cliente de escritorio de WhatsApp.

            ## Windows

            `whatfast-windows.zip` trae los dos ejecutables: `whatfast.exe` (la
            interfaz nativa) y `whatfast-backend.exe` (el sidecar que habla con
            WhatsApp). Los dos tienen que estar en la misma carpeta.

            `whatfast-setup.exe` es el instalador: deja todo en Archivos de
            programa y arma los accesos directos.

            ## Linux

            `whatfast-linux.tar.gz`. Se descomprime en cualquier carpeta y se
            corre `./whatfast`; `whatfast` y `whatfast-backend` van juntos.
            Para instalarlo en el sistema, desde la carpeta descomprimida:

            ```
            sudo install -Dm755 whatfast whatfast-backend -t /usr/local/bin
            sudo install -Dm644 share/applications/whatfast.desktop -t /usr/share/applications
            sudo cp -r share/icons/hicolor/* /usr/share/icons/hicolor/
            ```

            El binario pide estas bibliotecas del sistema (Wayland y fontconfig
            van por dlopen: si estan, las usa). En Debian y Ubuntu:

            ```
            sudo apt install libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
              libxcb-xkb1 libxau6 libxdmcp6 libfontconfig1 libgl1 libvulkan1 \
              libasound2
            ```

            ## macOS

            Esta version no trae paquete de macOS.
