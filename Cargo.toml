[workspace]
resolver = "3"
members = [
    "crates/whatfast-agents",
    "crates/whatfast-auto",
    "crates/whatfast-core",
    "crates/whatfast-i18n",
    "crates/whatfast-mcp",
    "crates/whatfast-model",
    "crates/whatfast-protocol",
    "crates/whatfast-ui",
    "crates/whatfast-wa",
]

[workspace.package]
version = "0.2.31"
edition = "2024"
# 1.88 is the floor of `opus-pure`, the pure-Rust encoder of the voice notes
# (`whatfast-ui`): the rest of the workspace compiles with less.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Owning01/whatfast-rs"

# The Windows backend of GPUI only asks DirectWrite for COLR glyphs, so the
# emoji sets that ship as PNG bitmaps (CBDT/CBLC, sbix) draw nothing. The copy
# in `vendor/gpui_windows` adds that path. Drop the patch when Zed supports it.
[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
# The desktop and the sidecar allocate thousands of short-lived Protobuf,
# image and audio buffers. mimalloc keeps those small blocks per thread and
# takes less contention than the Windows heap in the multi-threaded loops.
mimalloc = "0.1"
prost = "0.14"
thiserror = "2.0"
tracing = "0.1"

[profile.release]
# `"s"` turned off loop unrolling and most of the autovectorization in the
# decoders and the layout. The binary grows, the hot loops get the instructions
# they were written for.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile has to live in the root of the workspace: cargo IGNORES the
# profiles of the members, and the default is the full debug info. On
# Windows that means the debug data ends up twice: inside the .rlib files
# and in a .pdb next to them. Measured on this repository: the rlib of a
# mid-sized crate weighs 62,6 MB with "limited" and 24,4 MB with
# "line-tables-only", which is the same size as without debug info but keeps
# the line numbers, so the backtraces still point at a line.
[profile.dev]
debug = "line-tables-only"
